<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <title>EduKids: Petualangan Belajar</title>
    <style>
     :root {
    --primary: #FF6B6B;
    --secondary: #4ECDC4;
    --accent: #FFE66D;
    --bg: #F7F9FC;
    --text: #2D3436;
}
* { box-sizing: border-box; font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; }

/* Animasi Latar Belakang Gradien Bergerak */
body { 
    margin: 0; padding: 20px; color: var(--text); 
    display: flex; justify-content: center; align-items: center; min-height: 100vh;
    background: linear-gradient(-45deg, #FF9A9E, #FECFEF, #A1C4FD, #C2E9FB);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
}
@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

#app { 
    max-width: 800px; width: 100%; background: rgba(255, 255, 255, 0.9); 
    border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); 
    backdrop-filter: blur(10px); overflow: hidden; 
}
header { background: var(--primary); color: white; padding: 20px; text-align: center; border-radius: 30px 30px 0 0; }
h1 { margin: 0; font-size: 28px; text-shadow: 2px 2px 0px rgba(0,0,0,0.1); }
.score-board { font-size: 18px; font-weight: bold; background: rgba(255,255,255,0.3); padding: 8px 20px; border-radius: 20px; display: inline-block; margin-top: 10px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1); }

main { padding: 30px; text-align: center; min-height: 400px; display: flex; flex-direction: column; justify-content: center; align-items: center; }

#loading-screen { font-size: 20px; font-weight: bold; color: var(--secondary); margin-bottom: 20px; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

.menu-grid { display: none; gap: 20px; justify-content: center; flex-wrap: wrap; width: 100%; }

/* Gaya Claymorphism untuk Kartu Menu */
.card { 
    background: var(--secondary); color: white; padding: 40px 20px; border-radius: 25px; 
    cursor: pointer; width: 220px; font-size: 26px; font-weight: bold; border: none; outline: none;
    box-shadow: 8px 8px 16px rgba(0,0,0,0.1), -8px -8px 16px rgba(255,255,255,0.8), inset 0 -5px 15px rgba(0,0,0,0.1);
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}
.card.ipas { background: var(--primary); }
.card:hover { transform: translateY(-8px) scale(1.03); box-shadow: 12px 12px 20px rgba(0,0,0,0.15), -12px -12px 20px rgba(255,255,255,0.9); }
.card:active { transform: scale(0.95); }

.quiz-container { display: none; flex-direction: column; align-items: center; width: 100%; }

/* Animasi Mengambang pada Visual Soal */
.visual-model { 
    font-size: 50px; margin: 20px 0; background: rgba(255,255,255,0.5); 
    padding: 20px; border-radius: 20px; width: 100%; letter-spacing: 5px;
    box-shadow: inset 0 5px 10px rgba(0,0,0,0.05);
    animation: float 3s ease-in-out infinite;
}
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
}

.question-text { font-size: 24px; margin-bottom: 30px; line-height: 1.5; font-weight: bold; color: #4a4a4a; }
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 600px; }

/* Gaya Tombol Pilihan Ganda */
.btn-option { 
    padding: 20px; font-size: 22px; border: none; background: #f0f3f5; 
    border-radius: 20px; cursor: pointer; font-weight: bold; color: var(--text); 
    box-shadow: 5px 5px 10px rgba(0,0,0,0.05), -5px -5px 10px rgba(255,255,255,1);
    transition: all 0.2s;
}
.btn-option:active { transform: scale(0.95); box-shadow: inset 5px 5px 10px rgba(0,0,0,0.05), inset -5px -5px 10px rgba(255,255,255,1); }

/* Animasi Jawaban Benar & Salah */
.correct-pop { animation: pop 0.5s forwards; background: #48BB78 !important; color: white !important; box-shadow: 0 10px 20px rgba(72, 187, 120, 0.4) !important; }
@keyframes pop { 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

.wrong-shake { animation: shake 0.4s; background: #F56565 !important; color: white !important; box-shadow: inset 0 3px 6px rgba(0,0,0,0.2) !important; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

.nav-btn { margin-top: 40px; padding: 15px 30px; font-size: 20px; background: var(--accent); border: none; border-radius: 15px; cursor: pointer; font-weight: bold; box-shadow: 0 5px 15px rgba(255, 230, 109, 0.4); transition: transform 0.2s; }
.nav-btn:hover { transform: scale(1.05); }

@media (max-width: 600px) { .options { grid-template-columns: 1fr; } .card { width: 100%; max-width: 300px; } }
    </style>
</head>
<body>

<div id="app">
    <header>
        <h1>🚀 EduKids Explorer</h1>
        <div class="score-board">Bintang Misi: <span id="score">0</span> ⭐️</div>
    </header>
    
    <main>
        <!-- Status Loading -->
        <div id="loading-screen">⏳ Memanggil soal dari markas (Cloudflare)...</div>

        <!-- Menu Utama -->
        <div id="main-menu" class="menu-grid">
            <button class="card math" onclick="startSubject('math')">
                🧮<br>Matematika
            </button>
            <button class="card ipas" onclick="startSubject('ipas')">
                🌍<br>IPAS
            </button>
        </div>
        <!-- Area Papan Peringkat -->
<div id="leaderboard-area" style="display:none; width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 20px; margin-top: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);">
    <h3 style="margin-top:0; color: var(--text);">🏆 Top 10 Bintang Terbanyak</h3>
    <div id="leaderboard-list" style="text-align: left; font-size: 18px;"></div>
</div>

        <!-- Area Kuis -->
        <div id="quiz-area" class="quiz-container">
            <div id="visual" class="visual-model"></div>
            <div id="question" class="question-text"></div>
            <div id="options" class="options"></div>
            <button class="nav-btn" onclick="goHome()">🏠 Kembali ke Markas</button>
        </div>
    </main>
</div>

<script>
    // Variabel awal
    let database = { math: [], ipas: [] };
    let currentSubject = '';
    let currentQuestionIndex = 0;
    let score = 0;

    const loadingScreen = document.getElementById('loading-screen');
    const mainMenu = document.getElementById('main-menu');
    const quizArea = document.getElementById('quiz-area');
    const visualEl = document.getElementById('visual');
    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const scoreEl = document.getElementById('score');

    // MENGAMBIL DATA DARI CLOUDFLARE API
    async function muatSoalDariCloudflare() {
        try {
            // ---> GANTI URL DI BAWAH INI DENGAN URL WORKERS ANDA (misal: https://edukids-api.username.workers.dev) <---
            const urlAPI = 'https://edukids-api.busan6202.workers.dev'; 
            
            const response = await fetch(urlAPI);
            database = await response.json();
            
            // Sembunyikan loading, tampilkan menu
            loadingScreen.style.display = 'none';
            mainMenu.style.display = 'flex';
            
            console.log("✅ Soal berhasil dimuat dari database Cloudflare!");
        } catch (error) {
            console.error("Gagal memuat soal:", error);
            loadingScreen.innerText = "❌ Gagal memuat soal. Periksa koneksi atau URL API.";
            loadingScreen.style.color = "red";
        }
    }

    // Panggil fungsi saat web dibuka
    muatSoalDariCloudflare();

    // Logika Kuis
    function startSubject(subject) {
        if(database[subject].length === 0) {
            alert("Belum ada soal untuk pelajaran ini di database!");
            return;
        }
        currentSubject = subject;
        currentQuestionIndex = 0;
        mainMenu.style.display = 'none';
        quizArea.style.display = 'flex';
        loadQuestion();
    }

    function loadQuestion() {
        const qData = database[currentSubject][currentQuestionIndex];
        visualEl.innerHTML = qData.visual;
        questionEl.innerHTML = qData.q;
        optionsEl.innerHTML = '';

        qData.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt, qData.ans);
            optionsEl.appendChild(btn);
        });
    }

function checkAnswer(btn, selected, correct) {
    // Matikan klik ganda
    Array.from(optionsEl.children).forEach(b => b.style.pointerEvents = 'none');
    
    if (selected === correct) {
        // Tambahkan efek membesar dan hijau
        btn.classList.add('correct-pop');
        
        // Picu ledakan confetti dari tengah bawah layar
        confetti({
            particleCount: 150,
            spread: 80,
            origin: { y: 0.6 },
            colors: ['#FF6B6B', '#4ECDC4', '#FFE66D']
        });

        score += 10;
        scoreEl.innerText = score;
        
        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < database[currentSubject].length) {
                loadQuestion();
            } else {
                visualEl.innerHTML = "🎉🎉🎉";
                questionEl.innerHTML = "Misi Selesai! Kamu Hebat!";
                optionsEl.innerHTML = '';
                setTimeout(simpanSkorKeDatabase, 1500); // Tunggu sebentar sebelum minta nama
            }
        }, 1500); // Jeda diperpanjang agar anak bisa menikmati confetti
        
    } else {
        // Tambahkan efek getar dan merah
        btn.classList.add('wrong-shake');
        
        // Tunjukkan jawaban yang benar
        Array.from(optionsEl.children).forEach(b => {
            if (b.innerText === correct) b.classList.add('correct-pop');
        });
        
        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < database[currentSubject].length) {
                loadQuestion();
            } else {
                visualEl.innerHTML = "💪✨";
                questionEl.innerHTML = "Misi Selesai! Terus berlatih ya!";
                optionsEl.innerHTML = '';
                setTimeout(simpanSkorKeDatabase, 1500);
            }
        }, 2500);
    }
}
    }

    function goHome() {
        quizArea.style.display = 'none';
        mainMenu.style.display = 'flex';
    }
    // Fungsi untuk mengambil data leaderboard dari API
async function muatLeaderboard() {
    try {
        const urlAPI = 'https://edukids-api.busan6202.workers.dev'; // Ganti dengan URL Worker Anda
        const response = await fetch(urlAPI + '/leaderboard');
        const data = await response.json();
        
        const lbList = document.getElementById('leaderboard-list');
        lbList.innerHTML = '';
        
        data.forEach((item, index) => {
            const medali = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : '⭐️️';
            lbList.innerHTML += `<div style="padding: 10px 0; border-bottom: 1px solid #eee;">
                ${medali} <b>${item.nama}</b> - ${item.skor} Poin (${item.mata_pelajaran.toUpperCase()})
            </div>`;
        });
        
        document.getElementById('leaderboard-area').style.display = 'block';
    } catch (error) {
        console.error("Gagal memuat leaderboard");
    }
}

// Fungsi untuk menyimpan skor
async function simpanSkorKeDatabase() {
    const namaPemain = prompt("Wow! Kuis selesai. Siapa namamu?");
    if (!namaPemain) return;

    try {
        const urlAPI = 'https://edukids-api.busan6202.workers.dev'; // Ganti dengan URL Worker Anda
        await fetch(urlAPI + '/simpan-skor', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                nama: namaPemain,
                mata_pelajaran: currentSubject,
                skor: score
            })
        });
        alert("Skor berhasil disimpan ke markas!");
        goHome();
    } catch (error) {
        alert("Ups, gagal menyimpan skor.");
    }
}
</script>

</body>
</html>
